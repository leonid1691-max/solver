<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Лабиринт Судьбы ❤️</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
}

body {
    font-family: 'Georgia', serif;
    background: linear-gradient(135deg, #0a0e27 0%, #1a0033 50%, #2d0a1f 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    color: #fff;
    position: relative;
    overflow: hidden;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
        radial-gradient(circle at 20% 20%, rgba(214, 107, 139, 0.18), transparent 30%),
        radial-gradient(circle at 80% 80%, rgba(120, 25, 55, 0.18), transparent 35%);
    pointer-events: none;
    z-index: 1;
}

.container {
    position: relative;
    z-index: 2;
    width: min(1200px, 100%);
}

.header {
    text-align: center;
    margin-bottom: 35px;
    animation: fadeDown 0.8s ease;
}

.header h1 {
    font-size: clamp(2.2rem, 4vw, 4rem);
    letter-spacing: 2px;
    margin-bottom: 10px;
    background: linear-gradient(135deg, #f6b2d1, #d66b8b, #ff88c1);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 25px rgba(214, 107, 139, 0.4);
}

.header p {
    font-size: clamp(1rem, 1.8vw, 1.3rem);
    color: #e0b8c3;
    font-style: italic;
}

.main-content {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 40px;
    align-items: center;
}

.maze-side, .info-side {
    animation: fadeRight 0.9s ease both;
}

.maze-container {
    position: relative;
    aspect-ratio: 1;
    background: linear-gradient(135deg, rgba(18, 11, 26, 0.95), rgba(28, 8, 22, 0.95));
    border: 2px solid rgba(214, 107, 139, 0.7);
    border-radius: 28px;
    padding: 22px;
    box-shadow: 0 0 60px rgba(214, 107, 139, 0.28), inset 0 0 25px rgba(214, 107, 139, 0.18);
}

.maze-canvas {
    width: 100%;
    height: 100%;
    display: block;
    border-radius: 20px;
}

.info-panel {
    background: linear-gradient(135deg, rgba(29, 20, 24, 0.94), rgba(40, 15, 30, 0.97));
    border: 2px solid rgba(214, 107, 139, 0.6);
    border-radius: 22px;
    padding: 28px 22px;
    box-shadow: 0 0 36px rgba(214, 107, 139, 0.25);
}

.question-section h3 {
    color: #ff9cc6;
    margin-bottom: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-size: 0.82rem;
}

.question-text {
    font-size: clamp(1.15rem, 2vw, 1.7rem);
    line-height: 1.5;
    margin-bottom: 26px;
    font-weight: 500;
    color: #fff;
}

.answers {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.answer-btn {
    width: 100%;
    text-align: left;
    background: rgba(214, 107, 139, 0.08);
    border: 1.5px solid rgba(214, 107, 139, 0.45);
    color: #f7edf1;
    border-radius: 16px;
    padding: 16px 18px;
    font-size: 1rem;
    cursor: pointer;
    transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease;
    font-family: inherit;
}

.answer-btn:hover:not(:disabled) {
    background: rgba(214, 107, 139, 0.15);
    border-color: rgba(214, 107, 139, 0.8);
    transform: translateX(4px);
}

.answer-btn:disabled {
    cursor: default;
}

.answer-btn.correct {
    background: rgba(62, 192, 112, 0.18);
    border-color: rgba(62, 192, 112, 0.9);
    color: #c7f9d8;
}

.answer-btn.incorrect {
    background: rgba(255, 96, 96, 0.12);
    border-color: rgba(255, 96, 96, 0.75);
    color: #ffd5d5;
}

.status {
    display: none;
    margin-top: 22px;
    padding: 14px 16px;
    border-radius: 12px;
    font-size: 0.98rem;
    border: 1px solid rgba(255,255,255,0.1);
}

.status.success {
    display: block;
    background: rgba(72, 187, 120, 0.12);
    border-color: rgba(72, 187, 120, 0.6);
    color: #c7f9d8;
}

.status.error {
    display: block;
    background: rgba(255, 99, 99, 0.1);
    border-color: rgba(255, 99, 99, 0.6);
    color: #ffdada;
}

.finish-screen {
    display: none;
    text-align: center;
    background: linear-gradient(135deg, rgba(29, 20, 24, 0.98), rgba(40, 15, 30, 0.99));
    border: 2px solid rgba(214, 107, 139, 0.7);
    border-radius: 26px;
    padding: 38px 26px;
    box-shadow: 0 0 50px rgba(214, 107, 139, 0.3);
}

.finish-screen.active {
    display: block;
    animation: pop 0.5s ease;
}

.finish-heart {
    font-size: 4rem;
    animation: heartbeat 1.5s infinite ease-in-out;
    margin-bottom: 8px;
}

.finish-screen h2 {
    font-size: clamp(1.8rem, 3vw, 3rem);
    margin-bottom: 16px;
    color: #ffc2dd;
}

.finish-screen p {
    color: #f0dfe5;
    line-height: 1.8;
    font-size: 1.05rem;
    white-space: pre-wrap;
}

.restart-btn {
    margin-top: 24px;
    border: none;
    background: linear-gradient(135deg, #d66b8b, #8c2949);
    color: white;
    padding: 14px 30px;
    border-radius: 14px;
    font-size: 1rem;
    cursor: pointer;
    font-weight: 600;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    box-shadow: 0 10px 30px rgba(214, 107, 139, 0.35);
}

.restart-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 14px 36px rgba(214, 107, 139, 0.45);
}

@keyframes fadeDown {
    from { opacity: 0; transform: translateY(-16px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes fadeRight {
    from { opacity: 0; transform: translateX(18px); }
    to { opacity: 1; transform: translateX(0); }
}

@keyframes pop {
    from { opacity: 0; transform: scale(0.96); }
    to { opacity: 1; transform: scale(1); }
}

@keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.14); }
}

@media (max-width: 900px) {
    .main-content {
        grid-template-columns: 1fr;
    }

    .maze-side {
        max-width: 560px;
        margin: 0 auto;
    }
}
</style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Лабиринт Судьбы</h1>
        <p>Выбирай правильно — и путь откроется.</p>
    </div>

    <div class="main-content">
        <div class="maze-side">
            <div class="maze-container">
                <canvas id="mazeCanvas" class="maze-canvas"></canvas>
            </div>
        </div>

        <div class="info-side">
            <div class="info-panel">
                <div class="question-section">
                    <h3 id="nodeNumber">Узел 1</h3>
                    <p class="question-text" id="questionText">Загрузка...</p>
                    <div class="answers" id="answers"></div>
                </div>
                <div id="statusMessage" class="status"></div>
            </div>
        </div>
    </div>

    <div class="finish-screen" id="finishScreen">
        <div class="finish-heart">❤️</div>
        <h2>Ты нашла выход!</h2>
        <p id="finishMessage">Поздравляем!</p>
        <button class="restart-btn" onclick="location.reload()">Играть снова</button>
    </div>
</div>

<script>
const labyrinth = {
    1: {
        question: "Ты стоишь у входа в тайный лабиринт. Что ты выбираешь?",
        options: [
            { text: "Смелый путь и решительный шаг", correct: true, next: 2 },
            { text: "Осторожный путь и сомнения", correct: false, next: 3 }
        ]
    },
    2: {
        question: "На пути закрытая красная дверь. Что делать?",
        options: [
            { text: "Искать ключ или другой проход", correct: true, next: 5 },
            { text: "Пробовать силой открыть её", correct: false, next: 4 }
        ]
    },
    3: {
        question: "Перед тобой две дорожки. Какая кажется правильной?",
        options: [
            { text: "Правая — там слышен шёпот воды", correct: true, next: 5 },
            { text: "Левая — она кажется светлее", correct: false, next: 6 }
        ]
    },
    4: {
        question: "Дверь рухнула, но за ней оказался тупик. Что теперь?",
        options: [
            { text: "Вернуться и найти другой путь", correct: true, next: 7 },
            { text: "Продолжать дальше без плана", correct: false, next: 'DEAD_END' }
        ]
    },
    5: {
        question: "Ты нашла комнату со странным зеркалом. Что это значит?",
        options: [
            { text: "Это не знак, а просто отражение пути", correct: true, next: 10 },
            { text: "Скорее всего, это ловушка", correct: false, next: 9 }
        ]
    },
    6: {
        question: "Светлый коридор закончился пустотой. Что ты делаешь?",
        options: [
            { text: "Возвращаюсь и выбираю другой путь", correct: true, next: 11 },
            { text: "Пытаюсь идти дальше в пустоту", correct: false, next: 'DEAD_END' }
        ]
    },
    7: {
        question: "Ты встретила старого путника. Он показывает вперед.",
        options: [
            { text: "Слушаю его и иду дальше", correct: true, next: 13 },
            { text: "Не доверяю незнакомцам и выбираю свой путь", correct: false, next: 14 }
        ]
    },
    9: {
        question: "В комнате со зеркалом есть лестница вниз. Стоит ли спускаться?",
        options: [
            { text: "Нет, это ловушка. Ищу другой ход", correct: true, next: 17 },
            { text: "Да, вниз может быть выход", correct: false, next: 'DEAD_END' }
        ]
    },
    10: {
        question: "Ты видишь яркий свет в конце коридора. Это выход?",
        options: [
            { text: "Да, я иду туда!", correct: true, next: 'END' },
            { text: "Пока не уверен, стоит остановиться", correct: false, next: 19 }
        ]
    },
    11: {
        question: "На перекрестке неожиданно открывается золотая дверь.",
        options: [
            { text: "Открываю её без страха", correct: true, next: 'END' },
            { text: "Слишком подозрительно. Пытаюсь уйти", correct: false, next: 'DEAD_END' }
        ]
    },
    13: {
        question: "Путник привел тебя к красивому залу. Впереди белый выход.",
        options: [
            { text: "Это мой путь — вперед!", correct: true, next: 'END' },
            { text: "Слишком легко, лучше проверить ещё раз", correct: false, next: 'DEAD_END' }
        ]
    },
    14: {
        question: "Ты нашла красивый сад, но он может быть ловушкой. Что выбираешь?",
        options: [
            { text: "Не отвлекаться и искать выход", correct: true, next: 'END' },
            { text: "Остаться в саду и забыть про лабиринт", correct: false, next: 'DEAD_END' }
        ]
    },
    17: {
        question: "Ловушка оказалась мнимой. Перед тобой серебряная лестница вверх.",
        options: [
            { text: "Поднимаюсь по ней", correct: true, next: 'END' },
            { text: "Понимаю, что это всё ещё чья-то игра", correct: false, next: 'DEAD_END' }
        ]
    },
    19: {
        question: "Сомнения замедляют тебя — свет начинает тускнеть. Что делать?",
        options: [
            { text: "Бежать к выходу, пока свет не исчез", correct: true, next: 'END' },
            { text: "Всё ещё ждать знака", correct: false, next: 'DEAD_END' }
        ]
    }
};

let currentNode = 1;
let correctAnswers = 0;
let totalAnswers = 0;

const canvas = document.getElementById('mazeCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
    const wrapper = canvas.parentElement;
    canvas.width = wrapper.clientWidth;
    canvas.height = wrapper.clientHeight;
    drawMaze();
}

function drawMaze() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    const cx = canvas.width / 2;
    const cy = canvas.height / 2;
    const maxR = Math.min(canvas.width, canvas.height) * 0.38;

    for (let i = 0; i < 12; i++) {
        ctx.beginPath();
        ctx.strokeStyle = `rgba(214,107,139, ${0.45 - i * 0.03})`;
        ctx.lineWidth = 2.2;
        ctx.arc(cx, cy, maxR - i * 5.5, 0, Math.PI * 2);
        ctx.stroke();
    }

    for (let a = 0; a < Math.PI * 2; a += Math.PI / 8) {
        const x = cx + Math.cos(a) * (maxR + 10);
        const y = cy + Math.sin(a) * (maxR + 10);
        ctx.beginPath();
        ctx.fillStyle = 'rgba(214,107,139,0.7)';
        ctx.arc(x, y, 4, 0, Math.PI * 2);
        ctx.fill();
    }

    const nodeCount = Object.keys(labyrinth).length;
    const angle = (currentNode % 16) * (Math.PI * 2 / 16);
    const distance = maxR * (1 - Math.min(currentNode / nodeCount, 0.75));
    const px = cx + Math.cos(angle) * distance;
    const py = cy + Math.sin(angle) * distance;

    const glow = ctx.createRadialGradient(px, py, 0, px, py, 30);
    glow.addColorStop(0, 'rgba(255,105,180,0.6)');
    glow.addColorStop(0.4, 'rgba(255,105,180,0.18)');
    glow.addColorStop(1, 'rgba(255,105,180,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(px, py, 30, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.strokeStyle = 'rgba(255,105,180,0.9)';
    ctx.lineWidth = 3;
    ctx.arc(px, py, 16, 0, Math.PI * 2);
    ctx.stroke();

    ctx.beginPath();
    ctx.fillStyle = '#d66b8b';
    ctx.arc(px, py, 8, 0, Math.PI * 2);
    ctx.fill();

    const exitGlow = ctx.createRadialGradient(cx, cy, 0, cx, cy, 44);
    exitGlow.addColorStop(0, 'rgba(118,255,118,0.6)');
    exitGlow.addColorStop(0.35, 'rgba(118,255,118,0.18)');
    exitGlow.addColorStop(1, 'rgba(118,255,118,0)');
    ctx.fillStyle = exitGlow;
    ctx.beginPath();
    ctx.arc(cx, cy, 44, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.strokeStyle = 'rgba(118,255,118,0.9)';
    ctx.lineWidth = 3;
    ctx.arc(cx, cy, 18, 0, Math.PI * 2);
    ctx.stroke();

    ctx.beginPath();
    ctx.fillStyle = '#8cff9a';
    ctx.arc(cx, cy, 10, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#001';
    ctx.font = 'bold 12px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('EXIT', cx, cy);

    const progress = Math.min(currentNode / nodeCount, 1) * 100;
    ctx.fillStyle = 'rgba(214,107,139,0.18)';
    ctx.fillRect(10, 12, canvas.width - 20, 8);
    ctx.fillStyle = 'rgba(214,107,139,0.85)';
    ctx.fillRect(10, 12, ((canvas.width - 20) * progress), 8);
}

function renderQuestion(nodeId) {
    const node = labyrinth[nodeId];
    if (!node) return;

    document.getElementById('nodeNumber').textContent = `Узел ${nodeId}`;
    document.getElementById('questionText').textContent = node.question;

    const container = document.getElementById('answers');
    container.innerHTML = '';

    node.options.forEach((option, index) => {
        const btn = document.createElement('button');
        btn.className = 'answer-btn';
        btn.textContent = option.text;
        btn.onclick = () => selectAnswer(index, option);
        container.appendChild(btn);
    });

    document.getElementById('statusMessage').className = 'status';
    document.getElementById('statusMessage').textContent = '';
}

function selectAnswer(index, option) {
    totalAnswers++;
    const status = document.getElementById('statusMessage');
    const buttons = document.querySelectorAll('.answer-btn');

    if (option.correct) {
        correctAnswers++;
        status.textContent = '✓ Правильный выбор! Путь открылся.';
        status.className = 'status success';
        buttons[index].classList.add('correct');
        buttons.forEach(btn => btn.disabled = true);

        setTimeout(() => {
            if (option.next === 'END') {
                showFinishScreen();
            } else if (option.next === 'DEAD_END') {
                showDeadEndScreen();
            } else {
                currentNode = option.next;
                resizeCanvas();
                renderQuestion(currentNode);
            }
        }, 1500);
    } else {
        status.textContent = '✗ Неверный выбор. Этот путь закрыт.';
        status.className = 'status error';
        buttons[index].classList.add('incorrect');
        buttons.forEach(btn => btn.disabled = true);

        setTimeout(() => {
            if (option.next === 'END') {
                showFinishScreen();
            } else if (option.next === 'DEAD_END') {
                showDeadEndScreen();
            } else {
                currentNode = option.next;
                resizeCanvas();
                renderQuestion(currentNode);
            }
        }, 1500);
    }
}

function showFinishScreen() {
    const percent = Math.round((correctAnswers / totalAnswers) * 100);
    document.getElementById('finishMessage').textContent = `Правильных ответов: ${correctAnswers} из ${totalAnswers} (${percent}%)\n\nТы нашла выход. Путь оказался не таким простым, как казался, но он был правильным. ❤️`;
    document.getElementById('finishScreen').classList.add('active');
    document.querySelector('.main-content').style.display = 'none';
}

function showDeadEndScreen() {
    const percent = Math.round((correctAnswers / totalAnswers) * 100);
    document.getElementById('finishMessage').textContent = `Правильных ответов: ${correctAnswers} из ${totalAnswers} (${percent}%)\n\nЭтот путь оказался тупиком, но ты не остановилась. Каждая ошибка — часть дороги. 💫`;
    document.getElementById('finishScreen').classList.add('active');
    document.querySelector('.main-content').style.display = 'none';
}

window.addEventListener('resize', resizeCanvas);
resizeCanvas();
renderQuestion(1);
</script>
</body>
</html>
