<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Лабиринт ❤️</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Arial', sans-serif;
    background: linear-gradient(135deg, #0a0e27 0%, #1a0033 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    color: #fff;
}

.container {
    width: 100%;
    max-width: 900px;
}

.header {
    text-align: center;
    margin-bottom: 30px;
}

.header h1 {
    font-size: 2.5em;
    margin-bottom: 10px;
    text-shadow: 0 0 20px rgba(214, 107, 139, 0.6);
}

.header p {
    font-size: 1.1em;
    color: #aaa;
}

.maze-wrapper {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 30px;
    margin-bottom: 30px;
}

.maze-container {
    background: rgba(20, 10, 30, 0.8);
    border: 2px solid #d66b8b;
    border-radius: 15px;
    padding: 20px;
    aspect-ratio: 1;
    position: relative;
    overflow: hidden;
}

.maze-canvas {
    width: 100%;
    height: 100%;
    display: block;
}

.info-panel {
    background: rgba(29, 20, 24, 0.9);
    border: 1px solid rgba(214, 107, 139, 0.3);
    border-radius: 15px;
    padding: 25px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

.question-section {
    margin-bottom: 20px;
}

.question-section h3 {
    color: #d66b8b;
    margin-bottom: 15px;
    font-size: 1.1em;
}

.question-text {
    font-size: 1.05em;
    line-height: 1.6;
    margin-bottom: 20px;
    color: #eee;
}

.answers {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.answer-btn {
    padding: 12px 16px;
    border: 1.5px solid rgba(214, 107, 139, 0.4);
    background: rgba(214, 107, 139, 0.1);
    color: #eee;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.3s ease;
    font-size: 0.95em;
    text-align: left;
}

.answer-btn:hover:not(:disabled) {
    background: rgba(214, 107, 139, 0.25);
    border-color: rgba(214, 107, 139, 0.7);
    transform: translateX(5px);
}

.answer-btn:disabled {
    cursor: not-allowed;
}

.answer-btn.correct {
    background: rgba(76, 175, 80, 0.3);
    border-color: rgba(76, 175, 80, 0.8);
    color: #76ff76;
}

.answer-btn.incorrect {
    background: rgba(244, 67, 54, 0.3);
    border-color: rgba(244, 67, 54, 0.8);
    color: #ff6b6b;
}

.status {
    margin-top: 20px;
    padding: 15px;
    background: rgba(255, 255, 255, 0.05);
    border-radius: 8px;
    text-align: center;
    font-size: 0.95em;
    display: none;
}

.status.success {
    background: rgba(76, 175, 80, 0.1);
    color: #76ff76;
    display: block;
}

.status.error {
    background: rgba(244, 67, 54, 0.1);
    color: #ff6b6b;
    display: block;
}

.finish-screen {
    display: none;
    text-align: center;
    padding: 40px;
    background: rgba(29, 20, 24, 0.95);
    border: 2px solid rgba(214, 107, 139, 0.5);
    border-radius: 15px;
}

.finish-screen.active {
    display: block;
}

.finish-screen h2 {
    font-size: 2em;
    margin-bottom: 20px;
    color: #d66b8b;
}

.finish-screen p {
    font-size: 1.1em;
    margin-bottom: 30px;
    line-height: 1.8;
    white-space: pre-wrap;
}

.restart-btn {
    padding: 15px 30px;
    background: linear-gradient(135deg, #d66b8b, #8c2949);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 1.05em;
    cursor: pointer;
    transition: all 0.3s ease;
}

.restart-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 0 20px rgba(214, 107, 139, 0.6);
}

@media (max-width: 768px) {
    .maze-wrapper {
        grid-template-columns: 1fr;
    }

    .header h1 {
        font-size: 1.8em;
    }

    .maze-container {
        max-width: 400px;
        margin: 0 auto;
    }
}
</style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🎭 Лабиринт Судьбы</h1>
        <p>Выбирай правильно, чтобы найти выход</p>
    </div>

    <div class="maze-wrapper">
        <div class="maze-container">
            <canvas id="mazeCanvas" class="maze-canvas"></canvas>
        </div>

        <div class="info-panel">
            <div class="question-section">
                <h3 id="nodeNumber">Узел 1</h3>
                <p class="question-text" id="questionText">Загрузка...</p>
                <div class="answers" id="answers"></div>
            </div>

            <div id="statusMessage" class="status"></div>
        </div>
    </div>

    <div class="finish-screen" id="finishScreen">
        <h2>🎉 Ты прошла лабиринт!</h2>
        <p id="finishMessage">Поздравляем!</p>
        <button class="restart-btn" onclick="location.reload()">Пройти ещё раз</button>
    </div>
</div>

<script>
// Лабиринт структура
const labyrinth = {
    1: {
        question: "Ты стоишь у входа в таинственный лабиринт. Какой ты?",
        options: [
            { text: "Смелая и решительная", correct: true, next: 2 },
            { text: "Осторожная и внимательная", correct: false, next: 3 }
        ]
    },
    2: {
        question: "Ты встретила закрытую красную дверь. Что делаешь?",
        options: [
            { text: "Пытаюсь её сломать", correct: false, next: 4 },
            { text: "Ищу ключ или другой путь", correct: true, next: 5 }
        ]
    },
    3: {
        question: "Перед тобой две тропинки. Какую выбрать?",
        options: [
            { text: "Левую - кажется светлее", correct: false, next: 6 },
            { text: "Правую - слышу звуки воды", correct: true, next: 5 }
        ]
    },
    4: {
        question: "Дверь рухнула, но коридор оказался тупиком. Что теперь?",
        options: [
            { text: "Вернуться и искать другой путь", correct: true, next: 7 },
            { text: "Продолжать вперед во что бы то ни стало", correct: false, next: 'DEAD_END' }
        ]
    },
    5: {
        question: "Ты нашла комнату с большим зеркалом. Что это значит?",
        options: [
            { text: "Это знак - нужно вернуться", correct: false, next: 9 },
            { text: "Это отражение моего пути - иду дальше", correct: true, next: 10 }
        ]
    },
    6: {
        question: "Светлый коридор привел в абсолютную пустоту. Стоп?",
        options: [
            { text: "Вернусь и выберу другую дорогу", correct: true, next: 11 },
            { text: "Прыгну вверх, может это небо", correct: false, next: 'DEAD_END' }
        ]
    },
    7: {
        question: "На пути встретила странного путника. Он указывает вперед.",
        options: [
            { text: "Слушаю его совет", correct: true, next: 13 },
            { text: "Не верю незнакомцам, иду сама", correct: false, next: 14 }
        ]
    },
    9: {
        question: "В комнате со зеркалом нашла лестницу вниз. Спускаться?",
        options: [
            { text: "Да, может быть выход внизу", correct: false, next: 'DEAD_END' },
            { text: "Нет, это ловушка, ищу вверх", correct: true, next: 17 }
        ]
    },
    10: {
        question: "Ты видишь яркий свет в конце коридора. Это выход?",
        options: [
            { text: "Да, бегу туда полным ходом!", correct: true, next: 'END' },
            { text: "Может это обман зрения", correct: false, next: 19 }
        ]
    },
    11: {
        question: "Вернулась на перекресток. Вдруг появилась золотая дверь!",
        options: [
            { text: "Открываю её с трепетом", correct: true, next: 'END' },
            { text: "Слишком подозрительно для меня", correct: false, next: 'DEAD_END' }
        ]
    },
    13: {
        question: "Путник привел тебя к красивому залу. Впереди белый выход!",
        options: [
            { text: "Это оно! Выходу верю!", correct: true, next: 'END' },
            { text: "Жду подтверждения", correct: false, next: 'DEAD_END' }
        ]
    },
    14: {
        question: "Самостоятельно нашла красивый сад. Остаться здесь?",
        options: [
            { text: "Да, здесь красиво и спокойно", correct: false, next: 'DEAD_END' },
            { text: "Нет, это отвлечение, ищу выход", correct: true, next: 'END' }
        ]
    },
    17: {
        question: "Ты избежала ловушки! Впереди серебряная лестница вверх.",
        options: [
            { text: "Поднимаюсь быстро", correct: true, next: 'END' },
            { text: "Это ещё одна ловушка", correct: false, next: 'DEAD_END' }
        ]
    },
    19: {
        question: "Сомнения замедлили тебя. Свет начинает тускнеть...",
        options: [
            { text: "Бегу к выходу, пока не потухло", correct: true, next: 'END' },
            { text: "Жду, может свет вернется", correct: false, next: 'DEAD_END' }
        ]
    }
};

let currentNode = 1;
let correctAnswersCount = 0;
let totalAnswersCount = 0;

const canvas = document.getElementById('mazeCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
    const container = canvas.parentElement;
    canvas.width = container.offsetWidth;
    canvas.height = container.offsetHeight;
    drawMaze();
}

function drawMaze() {
    ctx.fillStyle = 'rgba(10, 10, 20, 0.8)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;
    const maxRadius = Math.min(canvas.width, canvas.height) * 0.35;

    // Рисуем лабиринт как концентрические круги
    for (let i = 0; i < 12; i++) {
        ctx.strokeStyle = `rgba(214, 107, 139, ${0.4 - i * 0.03})`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(centerX, centerY, maxRadius - i * 6, 0, Math.PI * 2);
        ctx.stroke();
    }

    // Рисуем позицию игрока
    const nodeCount = Object.keys(labyrinth).length;
    const angle = (currentNode % 16) * (Math.PI * 2 / 16);
    const distance = maxRadius * (1 - Math.min(currentNode / nodeCount, 0.75));
    const playerX = centerX + Math.cos(angle) * distance;
    const playerY = centerY + Math.sin(angle) * distance;

    // Свечение позиции
    ctx.fillStyle = 'rgba(214, 107, 139, 0.3)';
    ctx.beginPath();
    ctx.arc(playerX, playerY, 20, 0, Math.PI * 2);
    ctx.fill();

    // Сама позиция
    ctx.fillStyle = '#d66b8b';
    ctx.beginPath();
    ctx.arc(playerX, playerY, 8, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = '#ff69b4';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(playerX, playerY, 8, 0, Math.PI * 2);
    ctx.stroke();

    // Центр - выход
    ctx.fillStyle = 'rgba(118, 255, 118, 0.4)';
    ctx.beginPath();
    ctx.arc(centerX, centerY, 20, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#76ff76';
    ctx.beginPath();
    ctx.arc(centerX, centerY, 12, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 14px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('EXIT', centerX, centerY);

    // Прогресс бар
    const progress = Math.min(currentNode / nodeCount, 1) * 100;
    ctx.fillStyle = 'rgba(214, 107, 139, 0.2)';
    ctx.fillRect(10, 10, (canvas.width - 20) * (progress / 100), 6);
    ctx.strokeStyle = 'rgba(214, 107, 139, 0.8)';
    ctx.lineWidth = 2;
    ctx.strokeRect(10, 10, canvas.width - 20, 6);
}

function displayQuestion(nodeId) {
    const node = labyrinth[nodeId];
    if (!node) return;

    document.getElementById('nodeNumber').textContent = `Узел ${nodeId}`;
    document.getElementById('questionText').textContent = node.question;

    const answersContainer = document.getElementById('answers');
    answersContainer.innerHTML = '';

    node.options.forEach((option, index) => {
        const button = document.createElement('button');
        button.className = 'answer-btn';
        button.textContent = option.text;
        button.onclick = () => selectAnswer(index, option);
        answersContainer.appendChild(button);
    });

    document.getElementById('statusMessage').className = 'status';
}

function selectAnswer(index, option) {
    totalAnswersCount++;
    const statusDiv = document.getElementById('statusMessage');
    const buttons = document.querySelectorAll('.answer-btn');

    if (option.correct) {
        correctAnswersCount++;
        statusDiv.textContent = '✓ Правильный выбор! Новая дорога открывается...';
        statusDiv.className = 'status success';

        buttons[index].classList.add('correct');
        buttons.forEach(btn => btn.disabled = true);

        setTimeout(() => {
            if (option.next === 'END') {
                showFinishScreen();
            } else if (option.next === 'DEAD_END') {
                showGameOverScreen();
            } else {
                currentNode = option.next;
                resizeCanvas();
                displayQuestion(currentNode);
            }
        }, 1800);
    } else {
        statusDiv.textContent = '✗ Неправильный выбор. Лабиринт закрывает этот путь...';
        statusDiv.className = 'status error';

        buttons[index].classList.add('incorrect');
        buttons.forEach(btn => btn.disabled = true);

        setTimeout(() => {
            if (option.next === 'DEAD_END') {
                showGameOverScreen();
            } else {
                currentNode = option.next;
                resizeCanvas();
                displayQuestion(currentNode);
            }
        }, 1800);
    }
}

function showFinishScreen() {
    const percentage = Math.round((correctAnswersCount / totalAnswersCount) * 100);
    const message = `🎉 Ты нашла выход из лабиринта!

Правильных ответов: ${correctAnswersCount} из ${totalAnswersCount} (${percentage}%)

Твой путь был полон выборов и испытаний. 
Но ты доверялась своему сердцу и нашла правильный путь. ❤️`;
    
    document.getElementById('finishMessage').textContent = message;
    document.getElementById('finishScreen').classList.add('active');
    document.querySelector('.maze-wrapper').style.display = 'none';
}

function showGameOverScreen() {
    const percentage = Math.round((correctAnswersCount / totalAnswersCount) * 100);
    const message = `😔 Ты застряла в лабиринте...

Правильных ответов: ${correctAnswersCount} из ${totalAnswersCount} (${percentage}%)

Лабиринт требует веры в себя и верных выборов. 
Но не отчаивайся - каждая попытка учит нас новому.`;
    
    document.getElementById('finishMessage').textContent = message;
    document.getElementById('finishScreen').classList.add('active');
    document.querySelector('.maze-wrapper').style.display = 'none';
}

window.addEventListener('resize', resizeCanvas);
resizeCanvas();
displayQuestion(1);
</script>
</body>
</html>
