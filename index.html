<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Пивной лабиринт</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(circle at 50% 20%, #fff6a8 0%, transparent 35%),
        linear-gradient(135deg, #5b351d, #9b5a25 50%, #3c2416);
    font-family: Arial, Helvetica, sans-serif;
    color: #fff;
    overflow-x: hidden;
}

.game {
    width: min(100%, 900px);
    margin: auto;
    padding: 15px;
}

/* HEADER */

.header {
    text-align: center;
    margin-bottom: 12px;
}

.title {
    font-size: clamp(28px, 7vw, 52px);
    font-weight: 900;
    color: #ffd928;
    text-shadow:
        3px 3px 0 #111,
        -2px -2px 0 #111,
        2px -2px 0 #111,
        -2px 2px 0 #111;
    transform: rotate(-1deg);
}

.subtitle {
    font-size: 14px;
    color: #ffe9b0;
    margin-top: -5px;
}

/* QUESTION */

.question-box {
    background: #fff8df;
    color: #24160e;
    border: 5px solid #111;
    border-radius: 22px;
    padding: 15px;
    text-align: center;
    box-shadow: 0 8px 0 #111;
    margin-bottom: 20px;
}

.question-number {
    font-size: 13px;
    font-weight: 900;
    color: #a85c13;
    text-transform: uppercase;
}

.question {
    font-size: clamp(27px, 7vw, 48px);
    font-weight: 900;
    margin: 5px 0 12px;
}

.answers {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}

.answer {
    border: 4px solid #111;
    border-radius: 15px;
    background: #ffd928;
    color: #111;
    padding: 13px 5px;
    font-size: 22px;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 5px 0 #111;
    transition: .12s;
}

.answer:hover {
    transform: translateY(-3px) rotate(-1deg);
}

.answer:active {
    transform: translateY(4px);
    box-shadow: 0 1px 0 #111;
}

.answer.correct {
    background: #55d66b;
}

.answer.wrong {
    background: #ff5757;
    animation: shake .35s;
}

@keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-8px) rotate(-2deg); }
    40% { transform: translateX(8px) rotate(2deg); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(6px); }
}

/* MAZE */

.maze-wrapper {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / .72;
    min-height: 330px;
    background: #89b94a;
    border: 6px solid #111;
    border-radius: 25px;
    overflow: hidden;
    box-shadow: 0 9px 0 #111;
}

/* grass texture */

.maze-wrapper::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
        radial-gradient(#729c3c 1px, transparent 1px),
        radial-gradient(#b4d76a 1px, transparent 1px);
    background-size: 18px 18px, 25px 25px;
    opacity: .5;
}

/* MAZE WALLS */

.wall {
    position: absolute;
    background: #d2b48c;
    border: 4px solid #111;
    border-radius: 10px;
    box-shadow: inset 0 0 0 4px #e7d0a8;
    z-index: 2;
}

/* bottle decoration */

.bottle {
    position: absolute;
    font-size: 34px;
    z-index: 4;
    filter: drop-shadow(2px 3px 0 #111);
    animation: bottleWiggle 2.5s infinite ease-in-out;
}

@keyframes bottleWiggle {
    0%,100% { transform: rotate(-3deg); }
    50% { transform: rotate(3deg); }
}

/* PLAYER */

.player {
    position: absolute;
    width: 62px;
    height: 75px;
    z-index: 10;
    transition:
        left .45s cubic-bezier(.2,.8,.2,1),
        top .45s cubic-bezier(.2,.8,.2,1);
    pointer-events: none;
}

.head {
    position: absolute;
    width: 55px;
    height: 55px;
    left: 3px;
    top: 0;
    background: #ffd928;
    border: 4px solid #111;
    border-radius: 48% 48% 45% 45%;
}

.eye {
    position: absolute;
    width: 13px;
    height: 17px;
    background: white;
    border: 3px solid #111;
    border-radius: 50%;
    top: 14px;
}

.eye.left {
    left: 13px;
}

.eye.right {
    left: 28px;
}

.pupil {
    width: 5px;
    height: 7px;
    background: #111;
    border-radius: 50%;
    position: absolute;
    left: 3px;
    top: 3px;
}

.nose {
    position: absolute;
    width: 15px;
    height: 10px;
    border-bottom: 3px solid #111;
    top: 32px;
    left: 20px;
    border-radius: 50%;
}

.mouth {
    position: absolute;
    width: 25px;
    height: 10px;
    border-bottom: 4px solid #111;
    border-radius: 50%;
    left: 13px;
    top: 39px;
}

.body {
    position: absolute;
    width: 35px;
    height: 27px;
    background: #4e91df;
    border: 4px solid #111;
    border-radius: 8px;
    left: 14px;
    top: 48px;
}

.leg {
    position: absolute;
    width: 8px;
    height: 18px;
    background: #ffd928;
    border: 3px solid #111;
    top: 68px;
}

.leg.left {
    left: 19px;
    transform: rotate(8deg);
}

.leg.right {
    left: 37px;
    transform: rotate(-8deg);
}

/* walking */

.player.walking .body {
    animation: walkBody .22s infinite alternate;
}

.player.walking .leg.left {
    animation: legLeft .22s infinite alternate;
}

.player.walking .leg.right {
    animation: legRight .22s infinite alternate;
}

@keyframes walkBody {
    from { transform: translateY(0); }
    to { transform: translateY(-4px); }
}

@keyframes legLeft {
    from { transform: rotate(15deg); }
    to { transform: rotate(-15deg); }
}

@keyframes legRight {
    from { transform: rotate(-15deg); }
    to { transform: rotate(15deg); }
}

/* FINISH */

.finish {
    position: absolute;
    right: 3%;
    bottom: 5%;
    font-size: 48px;
    z-index: 5;
    filter: drop-shadow(3px 3px 0 #111);
}

/* START */

.start {
    position: absolute;
    left: 3%;
    top: 5%;
    font-size: 15px;
    font-weight: 900;
    background: #fff;
    color: #111;
    border: 3px solid #111;
    padding: 5px 8px;
    border-radius: 10px;
    z-index: 5;
}

/* MESSAGE */

.message {
    text-align: center;
    min-height: 30px;
    margin-top: 15px;
    font-weight: 900;
    font-size: 18px;
}

/* PROGRESS */

.progress {
    height: 15px;
    background: #21160f;
    border: 3px solid #111;
    border-radius: 20px;
    overflow: hidden;
    margin-top: 10px;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: #ffd928;
    transition: width .5s;
}

/* WIN SCREEN */

.win {
    position: fixed;
    inset: 0;
    background: rgba(20,10,5,.88);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
}

.win.show {
    display: flex;
}

.win-card {
    background: #fff8df;
    color: #111;
    border: 6px solid #111;
    border-radius: 30px;
    padding: 30px;
    text-align: center;
    width: min(500px, 100%);
    box-shadow: 0 12px 0 #111;
    animation: pop .5s;
}

.win-card h2 {
    font-size: 42px;
    margin: 0;
    color: #f0ae00;
    text-shadow: 2px 2px #111;
}

.win-card p {
    font-size: 20px;
    font-weight: 700;
}

.restart {
    border: 4px solid #111;
    background: #ffd928;
    border-radius: 15px;
    padding: 14px 25px;
    font-size: 20px;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 5px 0 #111;
}

.restart:active {
    transform: translateY(4px);
    box-shadow: 0 1px 0 #111;
}

@keyframes pop {
    0% { transform: scale(.5) rotate(-5deg); }
    100% { transform: scale(1) rotate(0); }
}

/* MOBILE */

@media(max-width:600px) {

    .game {
        padding: 10px;
    }

    .answers {
        gap: 7px;
    }

    .answer {
        font-size: 19px;
        padding: 11px 3px;
    }

    .maze-wrapper {
        min-height: 320px;
    }

    .bottle {
        font-size: 27px;
    }

    .player {
        transform: scale(.8);
        transform-origin: top left;
    }
}
</style>
</head>

<body>

<div class="game">

    <div class="header">
        <div class="title">🍺 ПИВНОЙ ЛАБИРИНТ 🍺</div>
        <div class="subtitle">
            Решай примеры. Иди вперёд. Не заблудись.
        </div>
    </div>

    <div class="question-box">

        <div class="question-number">
            Вопрос <span id="questionNumber">1</span> из 10
        </div>

        <div class="question" id="question">
            2 + 2 = ?
        </div>

        <div class="answers" id="answers"></div>

        <div class="progress">
            <div class="progress-bar" id="progress"></div>
        </div>

    </div>

    <div class="maze-wrapper" id="maze">

        <div class="start">СТАРТ</div>

        <div class="finish">🏁</div>

        <!-- стены лабиринта -->

        <div class="wall" style="left:18%;top:0;width:5%;height:48%;"></div>
        <div class="wall" style="left:18%;top:60%;width:5%;height:40%;"></div>

        <div class="wall" style="left:38%;top:20%;width:5%;height:65%;"></div>

        <div class="wall" style="left:58%;top:0;width:5%;height:48%;"></div>
        <div class="wall" style="left:58%;top:65%;width:5%;height:35%;"></div>

        <div class="wall" style="left:78%;top:20%;width:5%;height:65%;"></div>

        <div class="wall" style="left:0;top:30%;width:18%;height:5%;"></div>
        <div class="wall" style="left:23%;top:30%;width:15%;height:5%;"></div>

        <div class="wall" style="left:43%;top:70%;width:15%;height:5%;"></div>
        <div class="wall" style="left:63%;top:45%;width:15%;height:5%;"></div>

        <!-- бутылки -->

        <div class="bottle" style="left:4%;top:8%">🍺</div>
        <div class="bottle" style="left:25%;top:12%">🍺</div>
        <div class="bottle" style="left:47%;top:8%">🍺</div>
        <div class="bottle" style="left:68%;top:8%">🍺</div>

        <div class="bottle" style="left:7%;top:45%">🍺</div>
        <div class="bottle" style="left:28%;top:43%">🍺</div>
        <div class="bottle" style="left:48%;top:52%">🍺</div>
        <div class="bottle" style="left:87%;top:53%">🍺</div>

        <div class="bottle" style="left:26%;top:77%">🍺</div>
        <div class="bottle" style="left:67%;top:77%">🍺</div>

        <!-- игрок -->

        <div class="player" id="player">

            <div class="head">
                <div class="eye left">
                    <div class="pupil"></div>
                </div>

                <div class="eye right">
                    <div class="pupil"></div>
                </div>

                <div class="nose"></div>
                <div class="mouth"></div>
            </div>

            <div class="body"></div>

            <div class="leg left"></div>
            <div class="leg right"></div>

        </div>

    </div>

    <div class="message" id="message">
        Выбери правильный ответ!
    </div>

</div>

<!-- WIN -->

<div class="win" id="win">

    <div class="win-card">

        <h2>🏆 ПОБЕДА!</h2>

        <p>
            Ты прошёл весь лабиринт!
        </p>

        <div style="font-size:70px;margin:15px;">
            🟨 🍺 🏁
        </div>

        <p id="finalScore"></p>

        <button class="restart" onclick="restartGame()">
            🔄 ЕЩЁ РАЗ
        </button>

    </div>

</div>

<script>

/* =========================
   ВОПРОСЫ
========================= */

const questions = [
    {
        q: "2 + 2 = ?",
        a: [3, 4, 5],
        correct: 4
    },
    {
        q: "6 + 4 = ?",
        a: [8, 10, 12],
        correct: 10
    },
    {
        q: "3 + 1 = ?",
        a: [3, 4, 5],
        correct: 4
    },
    {
        q: "7 + 5 = ?",
        a: [11, 12, 13],
        correct: 12
    },
    {
        q: "9 - 3 = ?",
        a: [5, 6, 7],
        correct: 6
    },
    {
        q: "4 × 3 = ?",
        a: [10, 12, 14],
        correct: 12
    },
    {
        q: "20 - 7 = ?",
        a: [11, 13, 15],
        correct: 13
    },
    {
        q: "5 × 5 = ?",
        a: [20, 25, 30],
        correct: 25
    },
    {
        q: "18 ÷ 3 = ?",
        a: [5, 6, 7],
        correct: 6
    },
    {
        q: "12 + 8 = ?",
        a: [18, 20, 22],
        correct: 20
    }
];


/* =========================
   ПЕРЕМЕННЫЕ
========================= */

let currentQuestion = 0;
let score = 0;

const player = document.getElementById("player");
const question = document.getElementById("question");
const answers = document.getElementById("answers");
const questionNumber = document.getElementById("questionNumber");
const message = document.getElementById("message");
const progress = document.getElementById("progress");
const win = document.getElementById("win");
const finalScore = document.getElementById("finalScore");


/* =========================
   ТОЧКИ ДВИЖЕНИЯ
========================= */

const positions = [
    {x: 5, y: 7},
    {x: 26, y: 7},
    {x: 47, y: 7},
    {x: 67, y: 7},
    {x: 88, y: 23},
    {x: 88, y: 48},
    {x: 67, y: 52},
    {x: 47, y: 80},
    {x: 26, y: 82},
    {x: 5, y: 78},
    {x: 88, y: 82}
];


/* =========================
   ПОКАЗ ВОПРОСА
========================= */

function showQuestion() {

    const data = questions[currentQuestion];

    question.innerText = data.q;

    questionNumber.innerText = currentQuestion + 1;

    answers.innerHTML = "";

    data.a.forEach(number => {

        const button = document.createElement("button");

        button.className = "answer";
        button.innerText = number;

        button.onclick = () => checkAnswer(number, button);

        answers.appendChild(button);

    });

    progress.style.width =
        (currentQuestion / questions.length * 100) + "%";
}


/* =========================
   ПРОВЕРКА
========================= */

function checkAnswer(value, button) {

    const data = questions[currentQuestion];

    const allButtons =
        document.querySelectorAll(".answer");

    allButtons.forEach(b => b.disabled = true);

    if (value === data.correct) {

        button.classList.add("correct");

        score++;

        message.innerText =
            "✅ Правильно! Идём дальше!";

        movePlayer();

        setTimeout(() => {

            currentQuestion++;

            if (currentQuestion >= questions.length) {

                finishGame();

            } else {

                showQuestion();

            }

        }, 650);

    } else {

        button.classList.add("wrong");

        message.innerText =
            "❌ Не туда! Попробуй ещё раз.";

        setTimeout(() => {

            allButtons.forEach(b => {
                b.disabled = false;
            });

            button.classList.remove("wrong");

        }, 600);
    }
}


/* =========================
   ДВИЖЕНИЕ
========================= */

function movePlayer() {

    const position =
        positions[Math.min(currentQuestion + 1, positions.length - 1)];

    player.classList.add("walking");

    player.style.left = position.x + "%";
    player.style.top = position.y + "%";

    setTimeout(() => {
        player.classList.remove("walking");
    }, 500);
}


/* =========================
   ПОБЕДА
========================= */

function finishGame() {

    progress.style.width = "100%";

    message.innerText =
        "🏁 Финиш! Ты выбрался!";

    setTimeout(() => {

        finalScore.innerText =
            `Правильных ответов: ${score} из ${questions.length}`;

        win.classList.add("show");

    }, 700);
}


/* =========================
   RESTART
========================= */

function restartGame() {

    currentQuestion = 0;
    score = 0;

    win.classList.remove("show");

    player.style.left = positions[0].x + "%";
    player.style.top = positions[0].y + "%";

    message.innerText =
        "Выбери правильный ответ!";

    showQuestion();
}


/* =========================
   START
========================= */

player.style.left = positions[0].x + "%";
player.style.top = positions[0].y + "%";

showQuestion();

</script>

</body>
</html>
