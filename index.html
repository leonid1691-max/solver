<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Цветочек — Лабиринт</title>
<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}
html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}
body {
    background:
        radial-gradient(circle at 50% 15%, #fff2a6, transparent 35%),
        linear-gradient(145deg, #30234f, #5c3f72 45%, #211a36);
    font-family:
        Arial,
        Helvetica,
        sans-serif;
    overflow-x: hidden;
    color: #fff;
}
/* =========================================================
   GAME
========================================================= */
.game {
    width: min(100%, 1000px);
    margin: auto;
    padding: 12px;
}
/* =========================================================
   TITLE
========================================================= */
.title {
    text-align: center;
    font-size:
        clamp(28px, 7vw, 54px);
    font-weight: 1000;
    color: #ffd72f;
    text-shadow:
        4px 4px 0 #17111d,
        -2px -2px 0 #17111d,
        2px -2px 0 #17111d,
        -2px 2px 0 #17111d;
    letter-spacing: -1px;
    margin-bottom: 2px;
}
.subtitle {
    text-align: center;
    color: #f6ddff;
    font-size: 14px;
    margin-bottom: 13px;
}
/* =========================================================
   QUESTION PANEL
========================================================= */
.question-box {
    position: relative;
    background:
        linear-gradient(
            180deg,
            #fffef2,
            #fff0c9
        );
    color: #231829;
    border: 5px solid #17111d;
    border-radius: 23px;
    padding: 13px;
    text-align: center;
    box-shadow:
        0 8px 0 #17111d;
    margin-bottom: 18px;
    z-index: 50;
}
.question-number {
    font-size: 12px;
    font-weight: 1000;
    text-transform: uppercase;
    color: #774c9b;
}
.question {
    font-size:
        clamp(27px, 7vw, 47px);
    font-weight: 1000;
    margin:
        3px 0 10px;
}
.answers {
    display: grid;
    grid-template-columns:
        repeat(3, 1fr);
    gap: 9px;
}
.answer {
    border: 4px solid #17111d;
    border-radius: 15px;
    background: #ffd72f;
    color: #17111d;
    padding: 12px 4px;
    font-size: 21px;
    font-weight: 1000;
    cursor: pointer;
    box-shadow:
        0 5px 0 #17111d;
    transition:
        transform .12s,
        box-shadow .12s;
}
.answer:hover {
    transform:
        translateY(-3px)
        rotate(-1deg);
}
.answer:active {
    transform:
        translateY(4px);
    box-shadow:
        0 1px 0 #17111d;
}
.answer.correct {
    background: #62df78;
}
.answer.wrong {
    background: #ff5d6c;
    animation:
        shake .35s;
}
.answer:disabled {
    cursor: default;
}
@keyframes shake {
    0%,100% {
        transform: translateX(0);
    }
    20% {
        transform: translateX(-9px) rotate(-2deg);
    }
    40% {
        transform: translateX(9px) rotate(2deg);
    }
    60% {
        transform: translateX(-6px);
    }
    80% {
        transform: translateX(6px);
    }
}
/* =========================================================
   PROGRESS
========================================================= */
.progress {
    height: 13px;
    background: #26192e;
    border:
        3px solid #17111d;
    border-radius: 20px;
    overflow: hidden;
    margin-top: 10px;
}
.progress-bar {
    height: 100%;
    width: 0%;
    background:
        linear-gradient(
            90deg,
            #ffbf2f,
            #ffd72f
        );
    transition:
        width .5s ease;
}
/* =========================================================
   WORLD VIEW
========================================================= */
.world-frame {
    position: relative;
    width: 100%;
    height:
        clamp(360px, 58vw, 560px);
    overflow: hidden;
    border:
        6px solid #17111d;
    border-radius: 28px;
    background: #7aa64e;
    box-shadow:
        0 10px 0 #17111d;
}
/* =========================================================
   CAMERA
========================================================= */
.world {
    position: absolute;
    width: 2600px;
    height: 900px;
    left: 0;
    top: 0;
    transition:
        transform 1.1s
        cubic-bezier(.22,.75,.2,1);
    background:
        radial-gradient(
            circle at 20px 20px,
            rgba(255,255,255,.09) 2px,
            transparent 3px
        );
    background-size: 38px 38px;
    background-color: #7ca74d;
}
/* =========================================================
   DECORATIVE CLOUDS
========================================================= */
.cloud {
    position: absolute;
    width: 120px;
    height: 40px;
    background: rgba(255,255,255,.8);
    border-radius: 50px;
    opacity: .75;
}
.cloud::before,
.cloud::after {
    content: "";
    position: absolute;
    background: inherit;
    border-radius: 50%;
}
.cloud::before {
    width: 50px;
    height: 50px;
    left: 18px;
    bottom: 5px;
}
.cloud::after {
    width: 65px;
    height: 65px;
    right: 18px;
    bottom: 0;
}
/* =========================================================
   ROOM FLOOR
========================================================= */
.floor {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 58%;
    background:
        linear-gradient(
            180deg,
            #d8b279,
            #bd8d59
        );
    border-top:
        8px solid #51351f;
}
/* =========================================================
   WALLS
========================================================= */
.wall {
    position: absolute;
    background:
        linear-gradient(
            90deg,
            #5d456f,
            #806195,
            #574067
        );
    border:
        5px solid #17111d;
    border-radius: 12px;
    box-shadow:
        inset 0 0 0 4px rgba(255,255,255,.12);
    z-index: 5;
}
/* =========================================================
   DOORS
========================================================= */
.door-frame {
    position: absolute;
    width: 110px;
    height: 190px;
    z-index: 12;
}
.door-frame::before {
    content: "";
    position: absolute;
    inset: -9px;
    background: #17111d;
    border-radius: 14px;
}
.door {
    position: absolute;
    inset: 0;
    background:
        linear-gradient(
            90deg,
            #3a214e,
            #684080,
            #3a214e
        );
    border:
        5px solid #17111d;
    border-radius:
        8px 8px 3px 3px;
    transform-origin:
        left center;
    transition:
        transform .8s
        cubic-bezier(.2,.8,.2,1);
}
.door::before {
    content: "";
    position: absolute;
    inset: 13px;
    border:
        3px solid #9e79b6;
    border-radius: 5px;
    box-shadow:
        inset 0 0 0 3px #402753;
}
.door::after {
    content: "●";
    position: absolute;
    right: 10px;
    top: 86px;
    color: #ffd72f;
    font-size: 17px;
}
.door.open {
    transform:
        perspective(500px)
        rotateY(-108deg);
}
.door-number {
    position: absolute;
    left: 50%;
    top: -37px;
    transform:
        translateX(-50%);
    background: #fff;
    color: #17111d;
    border:
        4px solid #17111d;
    border-radius: 10px;
    padding: 4px 9px;
    white-space: nowrap;
    font-size: 13px;
    font-weight: 1000;
    z-index: 20;
}
/* =========================================================
   PLAYER
========================================================= */
.player {
    position: absolute;
    width: 85px;
    height: 135px;
    z-index: 30;
    transition:
        left 1s
        cubic-bezier(.2,.8,.2,1),
        top 1s
        cubic-bezier(.2,.8,.2,1);
    pointer-events: none;
}
/* =========================================================
   NAME
========================================================= */
.name {
    position: absolute;
    left: 50%;
    top: -27px;
    transform:
        translateX(-50%);
    background: #fff;
    color: #17111d;
    border:
        4px solid #17111d;
    border-radius: 10px;
    padding:
        4px 9px;
    white-space: nowrap;
    font-size: 14px;
    font-weight: 1000;
    box-shadow:
        3px 3px 0 #17111d;
    z-index: 50;
}
/* =========================================================
   HAIR BACK
========================================================= */
.hair-back {
    position: absolute;
    width: 76px;
    height: 78px;
    left: 5px;
    top: 8px;
    background: #27242d;
    border:
        5px solid #17111d;
    border-radius:
        48% 48% 42% 42%;
    z-index: 1;
}
/* =========================================================
   HEAD
========================================================= */
.head {
    position: absolute;
    width: 68px;
    height: 72px;
    left: 9px;
    top: 14px;
    background: #ffd52e;
    border:
        5px solid #17111d;
    border-radius:
        47% 47% 44% 44%;
    z-index: 4;
}
/* =========================================================
   HAIR
========================================================= */
.hair-front {
    position: absolute;
    width: 73px;
    height: 36px;
    left: -7px;
    top: -12px;
    background: #27242d;
    border:
        5px solid #17111d;
    border-radius:
        55% 55% 35% 35%;
    z-index: 8;
}
.hair-front::before {
    content: "";
    position: absolute;
    width: 20px;
    height: 34px;
    left: -7px;
    top: 19px;
    background: #27242d;
    border-left:
        5px solid #17111d;
    border-radius:
        0 0 50% 50%;
}
.hair-front::after {
    content: "";
    position: absolute;
    width: 20px;
    height: 38px;
    right: -8px;
    top: 18px;
    background: #27242d;
    border-right:
        5px solid #17111d;
    border-radius:
        0 0 50% 50%;
}
/* =========================================================
   EYES
========================================================= */
.eye {
    position: absolute;
    width: 20px;
    height: 27px;
    background: white;
    border:
        4px solid #17111d;
    border-radius: 50%;
    top: 25px;
    z-index: 10;
}
.eye.left {
    left: 12px;
}
.eye.right {
    right: 12px;
}
.pupil {
    position: absolute;
    width: 8px;
    height: 11px;
    background: #17111d;
    border-radius: 50%;
    left: 5px;
    top: 5px;
}
/* =========================================================
   NOSE
========================================================= */
.nose {
    position: absolute;
    width: 19px;
    height: 12px;
    left: 25px;
    top: 47px;
    border-bottom:
        4px solid #17111d;
    border-radius: 50%;
}
/* =========================================================
   MOUTH
========================================================= */
.mouth {
    position: absolute;
    width: 31px;
    height: 15px;
    left: 18px;
    top: 55px;
    border-bottom:
        5px solid #17111d;
    border-radius: 50%;
}
/* =========================================================
   BODY
========================================================= */
.body {
    position: absolute;
    width: 50px;
    height: 47px;
    left: 17px;
    top: 80px;
    background: #e45d91;
    border:
        5px solid #17111d;
    border-radius:
        13px 13px 8px 8px;
    z-index: 4;
}
/* =========================================================
   ARMS
========================================================= */
.arm {
    position: absolute;
    width: 11px;
    height: 37px;
    top: 82px;
    background: #ffd52e;
    border:
        4px solid #17111d;
    border-radius: 12px;
    z-index: 3;
}
.arm.left {
    left: 10px;
    transform:
        rotate(22deg);
}
.arm.right {
    right: 8px;
    transform:
        rotate(-22deg);
}
/* =========================================================
   LEGS
========================================================= */
.leg {
    position: absolute;
    width: 12px;
    height: 31px;
    top: 119px;
    background: #ffd52e;
    border:
        4px solid #17111d;
    border-radius: 8px;
    z-index: 2;
}
.leg.left {
    left: 27px;
}
.leg.right {
    left: 48px;
}
/* =========================================================
   SHOES
========================================================= */
.shoe {
    position: absolute;
    width: 28px;
    height: 12px;
    background: #26222d;
    border:
        4px solid #17111d;
    border-radius: 50%;
    top: 145px;
    z-index: 2;
}
.shoe.left {
    left: 14px;
}
.shoe.right {
    left: 45px;
}
/* =========================================================
   WALK ANIMATION
========================================================= */
.player.walking .leg.left {
    animation:
        legLeft .22s infinite alternate;
}
.player.walking .leg.right {
    animation:
        legRight .22s infinite alternate;
}
.player.walking .shoe.left {
    animation:
        shoeLeft .22s infinite alternate;
}
.player.walking .shoe.right {
    animation:
        shoeRight .22s infinite alternate;
}
.player.walking .body {
    animation:
        bodyBounce .22s infinite alternate;
}
@keyframes legLeft {
    from {
        transform: rotate(20deg);
    }
    to {
        transform: rotate(-20deg);
    }
}
@keyframes legRight {
    from {
        transform: rotate(-20deg);
    }
    to {
        transform: rotate(20deg);
    }
}
@keyframes shoeLeft {
    from {
        transform: translateX(-4px);
    }
    to {
        transform: translateX(4px);
    }
}
@keyframes shoeRight {
    from {
        transform: translateX(4px);
    }
    to {
        transform: translateX(-4px);
    }
}
@keyframes bodyBounce {
    from {
        transform: translateY(0);
    }
    to {
        transform: translateY(-4px);
    }
}
/* =========================================================
   FINISH
========================================================= */
.finish {
    position: absolute;
    width: 100px;
    height: 100px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 60px;
    z-index: 10;
    filter:
        drop-shadow(4px 4px 0 #17111d);
}
/* =========================================================
   MESSAGE
========================================================= */
.message {
    min-height: 31px;
    text-align: center;
    margin-top: 14px;
    font-size: 18px;
    font-weight: 1000;
}
/* =========================================================
   WIN
========================================================= */
.win {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background:
        rgba(19,12,28,.9);
    z-index: 200;
    padding: 20px;
}
.win.show {
    display: flex;
}
.win-card {
    width:
        min(500px,100%);
    background:
        linear-gradient(
            180deg,
            #fffef2,
            #ffe9bd
        );
    color: #17111d;
    border:
        6px solid #17111d;
    border-radius: 30px;
    padding: 30px;
    text-align: center;
    box-shadow:
        0 12px 0 #17111d;
    animation:
        pop .5s ease;
}
.win-card h2 {
    margin: 0;
    font-size: 43px;
    color: #e8a91c;
    text-shadow:
        3px 3px 0 #17111d;
}
.win-card p {
    font-size: 20px;
    font-weight: 900;
}
.restart {
    border:
        4px solid #17111d;
    border-radius: 15px;
    background: #ffd72f;
    padding:
        14px 24px;
    font-size: 19px;
    font-weight: 1000;
    cursor: pointer;
    box-shadow:
        0 5px 0 #17111d;
}
.restart:active {
    transform:
        translateY(4px);
    box-shadow:
        0 1px 0 #17111d;
}
@keyframes pop {
    0% {
        transform:
            scale(.4)
            rotate(-5deg);
    }
    100% {
        transform:
            scale(1)
            rotate(0);
    }
}
/* =========================================================
   MOBILE
========================================================= */
@media(max-width:600px) {
    .game {
        padding: 9px;
    }
    .answers {
        gap: 6px;
    }
    .answer {
        font-size: 18px;
        padding: 11px 3px;
    }
    .world-frame {
        height: 390px;
    }
    .player {
        transform:
            scale(.75);
        transform-origin:
            center bottom;
    }
    .door-frame {
        transform:
            scale(.75);
        transform-origin:
            center bottom;
    }
}
</style>
</head>

            </div>
        </div>
    </div>
    <!-- =====================================================
         MESSAGE
    ====================================================== -->
    <div
        class="message"
        id="message"
    >
        Ответь правильно, чтобы открыть дверь 🚪
    </div>
</div>
<!-- =========================================================
     WIN
========================================================== -->
<div
    class="win"
    id="win"
>
    <div class="win-card">
        <h2>
            🌸 ПОБЕДА! 🌸
        </h2>
        <p>
            Цветочек прошла весь лабиринт!
        </p>
        <div
            style="
                font-size:70px;
                margin:15px;
            "
        >
            👩 🚪 🏁
        </div>
        <p id="finalScore"></p>
        <button
            class="restart"
            onclick="restartGame()"
        >
            🔄 ПРОЙТИ ЕЩЁ РАЗ
        </button>
    </div>
</div>
<script>
/* =========================================================
   ВОПРОСЫ
========================================================= */
const questions = [
    {
        q: "2 + 2 = ?",
        a: [3, 4, 5],
        correct: 4
    },
    {
        q: "6 + 4 = ?",
        a: [8, 10, 12],
        correct: 10
    },
    {
        q: "3 + 1 = ?",
        a: [3, 4, 5],
        correct: 4
    },
    {
        q: "7 + 5 = ?",
        a: [11, 12, 13],
        correct: 12
    },
    {
        q: "9 - 3 = ?",
        a: [5, 6, 7],
        correct: 6
    },
    {
        q: "4 × 3 = ?",
        a: [10, 12, 14],
        correct: 12
    },
    {
        q: "20 - 7 = ?",
        a: [11, 13, 15],
        correct: 13
    },
    {
        q: "5 × 5 = ?",
        a: [20, 25, 30],
        correct: 25
    },
    {
        q: "18 ÷ 3 = ?",
        a: [5, 6, 7],
        correct: 6
    },
    {
        q: "12 + 8 = ?",
        a: [18, 20, 22],
        correct: 20
    }
];
/* =========================================================
   VARIABLES
========================================================= */
let currentQuestion = 0;
let score = 0;
let moving = false;
const player =
    document.getElementById("player");
const world =
    document.getElementById("world");
const question =
    document.getElementById("question");
const answers =
    document.getElementById("answers");
const questionNumber =
    document.getElementById("questionNumber");
const progress =
    document.getElementById("progress");
const message =
    document.getElementById("message");
const win =
    document.getElementById("win");
const finalScore =
    document.getElementById("finalScore");
const doors = [
    document.getElementById("door1"),
    document.getElementById("door2"),
    document.getElementById("door3"),
    document.getElementById("door4")
];
/* =========================================================
   WAYPOINTS
========================================================= */
const waypoints = [
    {
        x: 80,
        y: 320
    },
    {
        x: 300,
        y: 320
    },
    {
        x: 385,
        y: 320
    },
    {
        x: 520,
        y: 320
    },
    {
        x: 700,
        y: 320
    },
    {
        x: 885,
        y: 320
    },
    {
        x: 1015,
        y: 320
    },
    {
        x: 1200,
        y: 320
    },
    {
        x: 1430,
        y: 320
    },
    {
        x: 1565,
        y: 320
    },
    {
        x: 1770,
        y: 320
    },
    {
        x: 1950,
        y: 320
    },
    {
        x: 2085,
        y: 320
    },
    {
        x: 2280,
        y: 320
    }
];
/* =========================================================
   SHOW QUESTION
========================================================= */
function showQuestion() {
    const data =
        questions[currentQuestion];
    question.innerText =
        data.q;
    questionNumber.innerText =
        currentQuestion + 1;
    answers.innerHTML = "";
    /*
       Перемешиваем варианты
    */
    const shuffled =
        [...data.a]
            .sort(
                () => Math.random() - .5
            );
    shuffled.forEach(value => {
        const button =
            document.createElement("button");
        button.className =
            "answer";
        button.innerText =
            value;
        button.onclick =
            () => checkAnswer(
                value,
                button
            );
        answers.appendChild(button);
    });
    progress.style.width =
        (
            currentQuestion /
            questions.length *
            100
        ) + "%";
}
/* =========================================================
   CHECK ANSWER
========================================================= */
function checkAnswer(
    value,
    button
) {
    if (moving) return;
    const data =
        questions[currentQuestion];
    if (
        value ===
        data.correct
    ) {
        moving = true;
        document
            .querySelectorAll(".answer")
            .forEach(
                b =>
                b.disabled = true
            );
        button.classList.add(
            "correct"
        );
        score++;
        message.innerText =
            "✅ Правильно! Дверь открывается...";
        openDoor();
    } else {
        button.classList.add(
            "wrong"
        );
        message.innerText =
            "❌ Не угадала! Дверь закрыта.";
        setTimeout(() => {
            button.classList.remove(
                "wrong"
            );
        }, 450);
    }
}
/* =========================================================
   OPEN DOOR
========================================================= */
function openDoor() {
    const doorIndex =
        currentQuestion %
        doors.length;
    const door =
        doors[doorIndex];
    /*
       1. открываем дверь
    */
    door.classList.add(
        "open"
    );
    /*
       2. начинаем идти
    */
    setTimeout(() => {
        player.classList.add(
            "walking"
        );
        /*
           Идём к двери
        */
        movePlayer(
            waypoints[
                Math.min(
                    currentQuestion * 2 + 2,
                    waypoints.length - 1
                )
            ],
            850
        );
    }, 650);
    /*
       3. после прохождения
          двигаемся дальше
    */
    setTimeout(() => {
        moveCamera();
    }, 1250);
    setTimeout(() => {
        nextQuestion();
    }, 1850);
}
/* =========================================================
   MOVE PLAYER
========================================================= */
function movePlayer(
    point,
    duration
) {
    player.style.transition =
        `
        left ${duration}ms
        cubic-bezier(.2,.8,.2,1),
        top ${duration}ms
        cubic-bezier(.2,.8,.2,1)
        `;
    player.style.left =
        point.x + "px";
    player.style.top =
        point.y + "px";
}
/* =========================================================
   CAMERA
========================================================= */
function moveCamera() {
    const playerX =
        parseInt(
            player.style.left
        ) || 80;
    /*
       Центрируем камеру
       примерно на героине.
    */
    let cameraX =
        playerX - 420;
    /*
       не уходим левее начала
    */
    cameraX =
        Math.max(
            0,
            cameraX
        );
    /*
       не уходим за конец мира
    */
    cameraX =
        Math.min(
            1760,
            cameraX
        );
    world.style.transform =
        `translateX(-${cameraX}px)`;
}
/* =========================================================
   NEXT QUESTION
========================================================= */
function nextQuestion() {
    currentQuestion++;
    if (
        currentQuestion >=
        questions.length
    ) {
        finishGame();
        return;
    }
    moving = false;
    player.classList.remove(
        "walking"
    );
    showQuestion();
    message.innerText =
        "🚪 Следующая дверь ждёт...";
}
/* =========================================================
   FINISH
========================================================= */
function finishGame() {
    moving = true;
    player.classList.add(
        "walking"
    );
    /*
       Идём к финишу
    */
    movePlayer(
        {
            x: 2280,
            y: 320
        },
        1400
    );
    setTimeout(() => {
        player.classList.remove(
            "walking"
        );
        progress.style.width =
            "100%";
        message.innerText =
            "🏁 Цветочек добралась до финиша!";
        setTimeout(() => {
            finalScore.innerText =
                "Правильных ответов: " +
                score +
                " из " +
                questions.length;
            win.classList.add(
                "show"
            );
        }, 600);
    }, 1500);
}
/* =========================================================
   RESTART
========================================================= */
function restartGame() {
    currentQuestion = 0;
    score = 0;
    moving = false;
    win.classList.remove(
        "show"
    );
    /*
       закрываем двери
    */
    doors.forEach(door => {
        door.classList.remove(
            "open"
        );
    });
    /*
       возвращаем игрока
    */
    player.classList.remove(
        "walking"
    );
    player.style.transition =
        "none";
    player.style.left =
        "80px";
    player.style.top =
        "320px";
    world.style.transform =
        "translateX(0)";
    setTimeout(() => {
        player.style.transition =
            `
            left 1s cubic-bezier(.2,.8,.2,1),
            top 1s cubic-bezier(.2,.8,.2,1)
            `;
    }, 50);
    message.innerText =
        "Ответь правильно, чтобы открыть дверь 🚪";
    showQuestion();
}
/* =========================================================
   START
========================================================= */
showQuestion();
</script>
</body>
</html>
